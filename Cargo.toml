[package]
name = "tiny-webp"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Lossy WebP encoder in Rust with a cwebp-shaped command line"
keywords = ["webp", "encoder", "image", "vp8", "lossy"]
categories = ["multimedia::encoding", "multimedia::images", "command-line-utilities"]
readme = "README.md"
repository = "https://github.com/hey-jj/tiny-webp"
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "benches/**",
    "fixtures/**",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
default = ["std", "cli"]
std = []
cli = [
    "std",
    "dep:lexopt",
    "dep:png",
    "dep:jpeg-decoder",
    "dep:image-webp",
]

[dependencies]
lexopt = { version = "0.3", optional = true }
png = { version = "0.18", optional = true }
jpeg-decoder = { version = "0.3", optional = true, default-features = false, features = ["platform_independent"] }
image-webp = { version = "0.2.4", optional = true }

[dev-dependencies]
criterion = "0.7"
image-webp = "0.2.4"
sha2 = "0.10"

[[bin]]
name = "tiny-webp"
path = "src/bin/tiny-webp.rs"
required-features = ["cli"]

[[bench]]
name = "encode"
harness = false

[profile.release]
lto = true
