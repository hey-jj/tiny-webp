name: fuzz

on:
  schedule:
    - cron: "27 7 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run -s none encode -- -runs=1000000 -max_len=65536
