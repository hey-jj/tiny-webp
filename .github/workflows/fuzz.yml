name: mutation

on:
  schedule:
    - cron: "27 7 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TINY_WEBP_MUTATION_RUNS: "1000000"

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --test mutation
      - name: upload mutation failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-failures
          path: tests/mutation-failures/
