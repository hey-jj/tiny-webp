name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: install libwebp
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y webp
          else
            brew install webp
          fi
      - name: name the oracle version
        run: |
          cwebp -version
          dwebp -version

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo build --no-default-features
      - run: cargo build --no-default-features --features std

      - name: the library spells no float type
        run: |
          if grep -rnwE 'f32|f64' src --exclude-dir=bin; then
            echo "a float type reached the library"
            exit 1
          fi

      - run: cargo bench --no-run
      - run: cargo run --example fixtures
      - run: cargo run --example bench

      - name: build the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: package the crate
        run: |
          set -o pipefail
          cargo package --locked 2>&1 | tee "$RUNNER_TEMP/package.log"
          if grep -q 'ignoring' "$RUNNER_TEMP/package.log"; then
            echo "cargo package left a file out"
            exit 1
          fi

  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo build --lib --bins --all-features
      - run: cargo build --no-default-features
      - run: cargo build --no-default-features --features std
