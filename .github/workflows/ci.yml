name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TINY_WEBP_REQUIRE_ORACLE: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            libwebp_archive: https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-linux-x86-64.tar.gz
            libwebp_sha256: 1c5ffab71efecefa0e3c23516c3a3a1dccb45cc310ae1095c6f14ae268e38067
          - os: macos-latest
            libwebp_archive: https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-mac-arm64.tar.gz
            libwebp_sha256: bc6bf84cc70f3f8574fba797d1e4a7dea4feebe9fa4be919f202413ea2b3b8f2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: install libwebp
        run: |
          archive="$RUNNER_TEMP/libwebp.tar.gz"
          install_dir="$RUNNER_TEMP/libwebp"
          curl --fail --location --silent --show-error \
            "${{ matrix.libwebp_archive }}" --output "$archive"
          printf '%s  %s\n' "${{ matrix.libwebp_sha256 }}" "$archive" \
            | shasum -a 256 --check -
          mkdir "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir/bin" >> "$GITHUB_PATH"
      - name: name the oracle version
        run: |
          cwebp_version="$(cwebp -version 2>&1)"
          dwebp_version="$(dwebp -version 2>&1)"
          printf '%s\n' "$cwebp_version"
          printf '%s\n' "$dwebp_version"
          test "$(printf '%s\n' "$cwebp_version" | sed -n '1p')" = "1.6.0"
          test "$(printf '%s\n' "$dwebp_version" | sed -n '1p')" = "1.6.0"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo build --no-default-features
      - run: cargo build --no-default-features --features std

      - name: the library spells no float type
        run: |
          if grep -rnwE 'f32|f64' src --exclude-dir=bin; then
            echo "a float type reached the library"
            exit 1
          fi

      - run: cargo bench --no-run
      - run: cargo run --example fixtures
      - run: cargo run --example bench

      - name: build the documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: package the crate
        run: |
          set -o pipefail
          cargo package --locked 2>&1 | tee "$RUNNER_TEMP/package.log"
          if grep -q 'ignoring' "$RUNNER_TEMP/package.log"; then
            echo "cargo package left a file out"
            exit 1
          fi

      - name: the graph carries no C
        run: |
          if cargo tree -e all --all-features | grep -E '\bcc v|-sys v|alloca'; then
            echo "a crate that compiles C or links a system library reached the graph"
            exit 1
          fi

  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo build --lib --bins --all-features
      - run: cargo build --no-default-features
      - run: cargo build --no-default-features --features std

  fuzz:
    name: fuzz
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run -s none encode -- -runs=20000 -max_len=65536
